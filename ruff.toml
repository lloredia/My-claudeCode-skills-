# Lint helper scripts that ship with skills.
# The selection is Ruff's default (pycodestyle errors + pyflakes).
# Rules below are ignored because they flag patterns that upstream
# skill scripts use on purpose.

line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402", # sys.path inserts before local imports
    "E722", # bare except in upstream examples
    "E741", # single-letter names in math snippets
    "F841", # unused locals kept as upstream wrote them
]
